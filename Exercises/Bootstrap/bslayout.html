<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex.5 Bootstrap layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>
<body>
    
    <div class="container">
        
        <!--Header-->
        <div class="row">
            <div class="col border border-black p-3">
                <h1>Bootstrap Layout</h1>
            </div>
        </div>

        <!--Main-->
        <div class="row">
            <!--Sidebar-->
            <div class="col-3 border border-black p-3">
                <p>Sidebar</p>
            </div>

            <!--Main content-->
                <div class="col-9 border border-black p-4">
                    <div class="container">
                        <!--Row1-->
                        <div class="row">
                            <div class="col-3 border border-black p-3">
                                3
                            </div>
                            <div class="col-9 border border-black p-3">
                                9
                            </div>
                        </div>
                        <!--Row2-->
                        <div class="row">
                            <div class="col-6 border border-black p-3">
                                6
                            </div>
                            <div class="col-6 border border-black p-3">
                                6
                            </div>
                        </div>
                        <!--Row3-->
                        <div class="row">
                            <div class="col-2 border border-black p-3">
                                2
                            </div>
                            <div class="col-8 border border-black p-3">
                                8
                            </div>
                            <div class="col-2 border border-black p-3">
                                2
                            </div>
                        </div>
                        <!--Row4-->
                        <div class="row">
                            <div class="col-1 border border-black p-3">
                                1
                            </div>
                            <div class="col-4 border border-black p-3">
                                4
                            </div>
                            <div class="col-6 border border-black p-3">
                                6
                            </div>
                            <div class="col-1 border border-black p-3">
                                1
                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </div>

        <!--Footer-->
        <div class="row">
            <div class="col border border-black p-3">
                <p>Footer</p>
            </div>
        </div>
    </div>

</body>
</html>
