<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs | Layouts</title>
    <link rel="stylesheet" href="divs.css">
</head>
<body>
    <!-- 
        Divs (or divisions) are used to group together HTML elements and apply styles or layout to them. 
        They are elements that can contain other elements, such as text, images, or other divs. 
    -->
    <div class="bigBox">
        <div class="smallBox red">
            <h1>Divs</h1>
            <p>These are some divs.</p>
        </div>

        <div class="smallBox blue">
            <h1>Second Box</h1>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
        </div>

        <div class="smallBox thirdBox">

            <div class="innerBox">
                <h2>Box 1</h2>
                <p>Some content.</p>
            </div>

            <div class="innerBox">
                <h2>Box 2</h2>
                <p>Some content.</p>
            </div>

            <div class="innerBox">
                <h2>Box 3</h2>
                <p>Some content.</p>
            </div>

            <div class="innerBox">
                <h2>Box 4</h2>
                <p>Some content.</p>
            </div>
        </div>
    </div>

</body>
</html>
